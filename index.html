<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<title>Carta olografica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: dark, glassy, premium; one object floating in a dark room.
   IDEA: a frosted-glass collectible lit from below by an aurora, with holo foil that wakes up when tilted.
   PICTURE: the photo rising out of the aurora in the lower card, displaced by its depth map in WebGL.
   COLOUR and TYPE: ink navy glass, magenta and violet light, white; Bebas Neue title, Outfit light body.
   LAYOUT: one centred card sized to the screen at 63:88; studio tools hidden unless creating. */
:root{color-scheme:dark;--tx:0;--ty:0;--mx:50%;--my:50%;--bx:50%;--by:50%;--hyp:0}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#08090f}
body{display:grid;place-items:center;color:#eef0f7;font:16px/1.5 Outfit,system-ui,sans-serif;
 background:radial-gradient(55% 40% at 50% 64%,rgba(130,70,210,.16),transparent 72%),radial-gradient(120% 90% at 50% 40%,#131526 0%,#08090f 66%);
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;perspective:1200px;width:min(84vw,60vh);aspect-ratio:63/88;touch-action:none}
@supports(height:1dvh){.stage{width:min(84vw,60dvh)}}
.halo{position:absolute;inset:18% -18% -16%;border-radius:50%;pointer-events:none;filter:blur(48px);opacity:calc(.55 + var(--hyp) * .35);
 background:radial-gradient(closest-side,rgba(214,92,255,.55),rgba(110,80,255,.25) 55%,transparent);
 transform:translate(calc(var(--tx) * -18px),calc(var(--ty) * -14px + 6%))}
.card{position:relative;width:100%;height:100%;container-type:inline-size;border-radius:4.4cqw;overflow:hidden;isolation:isolate;will-change:transform;
 transform:rotateX(calc(var(--ty) * -16deg)) rotateY(calc(var(--tx) * 18deg));
 background:linear-gradient(135deg,#e6e9f2 0%,#7d8296 18%,#fbfcff 36%,#6a6f84 54%,#d6dae6 72%,#585d72 100%);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),calc(var(--tx) * -22px) calc(var(--ty) * -18px + 34px) 70px rgba(0,0,0,.6);
 animation:enter 2.2s cubic-bezier(.6,0,.2,1) both}
@keyframes enter{0%{opacity:0;rotate:90deg;scale:.64;filter:brightness(.2) blur(22px)}22%{opacity:1;rotate:90deg;scale:.66;filter:brightness(.7) blur(18px)}100%{opacity:1;rotate:0deg;scale:1;filter:none}}
.halo{animation:halo 2.4s ease-out both}
@keyframes halo{0%,30%{opacity:0;scale:.6}}
.content{animation:rise 1.1s 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;translate:0 4cqw}}
.sweep{position:absolute;inset:0;z-index:8;pointer-events:none;border-radius:inherit;mix-blend-mode:overlay;
 background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:150% 0;
 animation:sweep 1.1s 2.1s ease-in-out both}
@keyframes sweep{from{background-position:150% 0}to{background-position:-60% 0}}
.heat{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit}
.foil,.spark{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.foil{mix-blend-mode:color-dodge;opacity:calc(.16 + var(--hyp) * .42);filter:brightness(.68) contrast(1.6) saturate(1.5);
 background:repeating-linear-gradient(115deg,#ff4f9b 0%,#ffcf4a 6%,#6dff9e 12%,#46d4ff 18%,#a56bff 24%,#ff4f9b 30%);
 background-size:320% 320%;background-position:var(--mx) var(--my)}
.spark{mix-blend-mode:color-dodge;opacity:calc(.3 + var(--hyp) * .6);background-image:var(--sp);background-size:120px 120px;
 background-position:calc(var(--tx) * -30px) calc(var(--ty) * -30px)}
.face{position:absolute;inset:4cqw;border-radius:4.4cqw;overflow:hidden;isolation:isolate;
 background:linear-gradient(180deg,#1d2239 0%,#13162a 42%,#0c0d17 100%);
 box-shadow:0 0 0 .5cqw rgba(20,16,40,.55),0 0 2.2cqw rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.art{position:absolute;inset:auto 0 0 0;height:70%;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 42%);mask-image:linear-gradient(180deg,transparent 0%,#000 42%)}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.art.loading{background:linear-gradient(100deg,transparent 40%,rgba(160,120,255,.18) 50%,transparent 60%) 0 0/300% 100%;animation:load 1.4s linear infinite}
@keyframes load{to{background-position:-300% 0}}
.aurora{position:absolute;left:-25%;right:-25%;bottom:-14%;height:58%;pointer-events:none;mix-blend-mode:screen;filter:blur(7cqw);
 background:radial-gradient(38% 52% at 30% 68%,rgba(255,96,214,.78),transparent 72%),radial-gradient(42% 50% at 72% 74%,rgba(112,82,255,.85),transparent 72%),radial-gradient(58% 36% at 50% 104%,rgba(255,236,255,.95),transparent 72%);
 transform:translate(calc(var(--tx) * -7cqw),calc(var(--ty) * -3cqw))}
.revwrap{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 72%);mask-image:linear-gradient(180deg,#000 30%,transparent 72%)}
.rev{position:absolute;inset:0;mix-blend-mode:screen;opacity:calc(.14 + var(--hyp) * .62);
 background:linear-gradient(112deg,transparent 22%,rgba(255,255,255,.75) 40%,rgba(214,170,255,.95) 48%,rgba(140,215,255,.85) 55%,rgba(255,190,240,.6) 60%,transparent 76%);
 background-size:320% 320%;background-position:var(--bx) var(--by);
 -webkit-mask-image:var(--pat);mask-image:var(--pat);-webkit-mask-size:8.5cqw 8.5cqw;mask-size:8.5cqw 8.5cqw;
 -webkit-mask-position:calc(var(--tx) * 1.2cqw) calc(var(--ty) * 1.2cqw);mask-position:calc(var(--tx) * 1.2cqw) calc(var(--ty) * 1.2cqw)}
.content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:flex-start;padding:7.5cqw 7.5cqw 0}
.badge{width:14.5cqw;height:14.5cqw;border-radius:50%;display:grid;place-items:center;
 background:radial-gradient(circle at 32% 25%,#3b4469,#1a1e34 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(255,255,255,.08),0 1.2cqw 3cqw rgba(0,0,0,.5)}
.badge svg{width:6.6cqw;height:6.6cqw}
.title{margin:11cqw 0 0;max-width:100%;font:400 13.6cqw/.94 'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:.005em;color:#f5f6fb;
 text-shadow:0 .5cqw 2cqw rgba(0,0,0,.55);overflow-wrap:anywhere}
.text{margin:3.4cqw 0 0;max-width:94%;font:300 4.5cqw/1.42 Outfit,system-ui,sans-serif;color:rgba(222,226,240,.74);
 display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cta{margin-top:5.6cqw;display:inline-flex;align-items:center;gap:1.6cqw;font:400 4.2cqw/1 Outfit,system-ui,sans-serif;color:#eceef6;text-decoration:none}
.cta svg{width:3.4cqw;height:3.4cqw}
.shine,.glitter,.sheen,.glare,.rim{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.shine{z-index:4;mix-blend-mode:color-dodge;opacity:calc(.08 + var(--hyp) * .3);filter:brightness(.42) contrast(1.7) saturate(1.1);
 background-image:
  repeating-linear-gradient(0deg,#ff6f8e 0%,#ffd46a 5.5%,#8dff86 11%,#6cf1ff 16.5%,#7f8cff 22%,#e47dff 27.5%,#ff6f8e 33%),
  repeating-linear-gradient(128deg,#0d1230 0%,#8c9db0 3.6%,#b9d4dc 4.4%,#8c9db0 5.2%,#0d1230 9.5%,#0d1230 12%),
  radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(0,0,0,.05) 10%,rgba(0,0,0,.2) 30%,rgba(0,0,0,.4) 110%);
 background-blend-mode:screen,hue,hard-light;background-size:480% 480%,320% 320%,200% 200%;
 background-position:0% var(--by),var(--bx) var(--by),center}
.glitter{z-index:4;mix-blend-mode:color-dodge;opacity:calc(var(--hyp) * .45);background-image:var(--sp);background-size:150px 150px;
 background-position:calc(var(--tx) * 36px) calc(var(--ty) * 36px)}
.sheen{z-index:5;mix-blend-mode:soft-light;opacity:calc(.25 + var(--hyp) * .4);
 background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.55) 46%,rgba(255,255,255,.05) 58%,transparent 70%);background-size:280% 280%;background-position:var(--bx) var(--by)}
.glare{z-index:6;mix-blend-mode:overlay;opacity:calc(.25 + var(--hyp) * .45);
 background:radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(255,255,255,.75) 0%,rgba(255,255,255,.12) 30%,rgba(0,0,0,.4) 100%)}
.rim{z-index:7;padding:1.5px;opacity:calc(.25 + var(--hyp) * .75);
 background:conic-gradient(from calc(var(--tx) * 140deg + 200deg),#ff7ad9,#ffd77a,#7affc1,#7ad7ff,#a27aff,#ff7ad9);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.pill,.tool{position:fixed;z-index:10;border:1px solid rgba(255,255,255,.14);background:rgba(20,22,38,.7);color:#eef0f7;
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:400 15px/1 Outfit,system-ui,sans-serif;cursor:pointer}
.pill{left:50%;bottom:calc(18px + env(safe-area-inset-bottom));translate:-50% 0;padding:13px 20px;border-radius:99px;min-height:44px;white-space:nowrap}
.tool{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;opacity:.6}
.tool:hover,.tool:focus-visible{opacity:1}
.sheet{position:fixed;z-index:20;inset:auto 0 0 0;margin:0 auto;max-width:440px;max-height:86dvh;overflow:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom));
 border-radius:22px 22px 0 0;background:rgba(17,19,33,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border:1px solid rgba(255,255,255,.1);font:15px/1.45 Outfit,system-ui,sans-serif;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0 0 10px;font:400 30px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.01em}
.sheet label{display:block;margin:10px 0 4px;color:#aeb3c8;font-size:13px}
.sheet input,.sheet textarea{width:100%;font:16px Outfit,system-ui,sans-serif;color:#fff;background:#0b0c16;border:1px solid #2d3150;border-radius:12px;padding:10px 12px}
.sheet textarea{resize:vertical;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{flex:1 1 auto;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid #33385a;background:#1b1e33;color:#eef0f7;font:400 14px Outfit,system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.btn.lit{border:0;color:#14081f;background:linear-gradient(100deg,#ff8fe0,#b59bff 55%,#f3eaff)}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.status{margin:12px 0 0;color:#cbb8ff;font-size:13px;min-height:1.4em}
.qr{margin-top:12px;text-align:center}.qr img{background:#fff;padding:8px;border-radius:10px;width:180px;image-rendering:pixelated}
.note{color:#7f849d;font-size:12px;margin-top:12px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #c8a8ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card,.halo,.content,.sweep{animation:none}.sweep{display:none}.art.loading{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="halo"></div>
 <div class="card" id="card">
  <canvas class="heat" id="heat"></canvas>
  <div class="foil"></div><div class="spark"></div>
  <div class="face">
  <div class="art loading" id="art"><canvas id="gl"></canvas></div>
  <div class="aurora"></div>
  <div class="revwrap"><div class="rev"></div></div>
  <div class="content">
   <div class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.3 6.9 6.9 2.6-6.9 2.6L12 21.5l-2.3-6.9L2.8 12l6.9-2.6z" fill="#eef0ff"/></svg></div>
   <h1 class="title" id="title"></h1>
   <p class="text" id="text"></p>
   <a class="cta" id="cta" target="_blank" rel="noopener"><span id="ctaLabel"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9L9 3M4.2 3H9v4.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></a>
  </div>
  <div class="shine"></div><div class="glitter"></div>
  </div>
  <div class="sheen"></div><div class="glare"></div><div class="sweep"></div>
 </div>
</div>

<button class="pill" id="motion" hidden>Tocca per attivare il movimento</button>
<button class="tool" id="tool" hidden aria-label="Crea la tua carta">
 <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.3 6.9 6.9 2.6-6.9 2.6L12 21.5l-2.3-6.9L2.8 12l6.9-2.6z" fill="#d9c8ff"/></svg>
</button>

<form class="sheet" id="sheet" hidden>
 <h2>Crea la tua carta</h2>
 <label for="f-photo">Fotografia</label><input id="f-photo" type="file" accept="image/*">
 <label for="f-name">Titolo</label><input id="f-name" maxlength="32">
 <label for="f-text">Testo</label><textarea id="f-text" maxlength="160"></textarea>
 <label for="f-cta">Etichetta del link</label><input id="f-cta" maxlength="30">
 <label for="f-link">Link (facoltativo)</label><input id="f-link" type="url" inputmode="url" placeholder="https://">
 <p class="status" id="status" role="status"></p>
 <div class="row">
  <a class="btn" id="dl" aria-disabled="true">Scarica mappa profondità</a>
  <button class="btn" type="button" id="copy" aria-disabled="true">Copia link</button>
  <button class="btn lit" type="button" id="qrb" aria-disabled="true">Crea QR</button>
 </div>
 <input id="link" readonly hidden aria-label="Link della carta" style="margin-top:10px">
 <div class="qr" id="qr"></div>
 <p class="note">Pubblica nella stessa cartella di questa pagina la foto e la mappa di profondità scaricata: il link e il QR puntano a quei due file.</p>
 <div class="row"><button class="btn" type="button" id="close">Chiudi</button></div>
</form>

<script>
{
/* ---------- Configurazione: modifica qui oppure passa i valori nell'URL (?img=foto.jpg&depth=foto-depth.png&name=...) ---------- */
const CARD = {img: '', depth: '', name: 'Aurora', text: 'Inclina il telefono o trascina la carta: il paesaggio si muove in profondità.',
 cta: 'Scopri di più', link: '', pos: '0.22', focus: '', strength: '0.045'};
const MODEL = 'onnx-community/depth-anything-v2-small';
const TJS = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
const QRJS = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';

const q = new URLSearchParams(location.search);
for (const k of Object.keys(CARD)) if (q.has(k)) CARD[k] = q.get(k);
const $ = id => document.getElementById(id);
const card = $('card'), art = $('art'), cv = $('gl');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = -1, b = 1) => Math.max(a, Math.min(b, v));
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let demo = false;

function renderText() {
  $('title').textContent = CARD.name; $('text').textContent = CARD.text; $('ctaLabel').textContent = CARD.cta;
  const safe = /^https?:\/\//i.test(CARD.link);
  if (safe) $('cta').href = CARD.link; else $('cta').removeAttribute('href');
  $('cta').hidden = !CARD.cta || (!safe && !demo);
  $('text').hidden = !CARD.text;
}

/* ---------- Texture brillantini ---------- */
function sparkle() {
  const c = mk(256, 256), x = c.getContext('2d');
  for (let i = 0; i < 340; i++) {
    const r = Math.random() ** 3 * 1.6 + .3;
    x.fillStyle = `rgba(255,255,255,${(Math.random() * .85 + .15).toFixed(2)})`;
    x.beginPath(); x.arc(Math.random() * 256, Math.random() * 256, r, 0, 7); x.fill();
  }
  return c.toDataURL();
}
card.style.setProperty('--sp', `url(${sparkle()})`);

/* ---------- Motivo stampato del foil "reverse holo" ---------- */
function pattern() {
  const c = mk(64, 64), x = c.getContext('2d');
  const star = (cx, cy, r) => { x.beginPath(); x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r); x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill(); };
  x.fillStyle = '#fff'; star(16, 16, 8); star(48, 48, 8);
  x.fillStyle = 'rgba(255,255,255,.7)'; for (const [a, b] of [[48, 16], [16, 48]]) { x.beginPath(); x.arc(a, b, 1.8, 0, 7); x.fill(); }
  for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(255,255,255,${(Math.random() * .4).toFixed(2)})`; x.fillRect(Math.random() * 64, Math.random() * 64, 1, 1); }
  return c.toDataURL();
}
card.style.setProperty('--pat', `url(${pattern()})`);

/* ---------- Cornice: shader "heated" che evolve lungo il bordo ---------- */
const hc = $('heat'), hg = hc.getContext('webgl', {antialias: false, premultipliedAlpha: false});
const HFS = `precision highp float;varying vec2 v;uniform vec2 uRes,uTilt;uniform float uT,uFw,uR;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}
float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
vec3 pal(float x){
 vec3 c=mix(vec3(.05,.035,.16),vec3(.24,.10,.58),smoothstep(0.,.28,x));
 c=mix(c,vec3(.62,.17,.88),smoothstep(.22,.46,x));
 c=mix(c,vec3(.98,.26,.70),smoothstep(.42,.62,x));
 c=mix(c,vec3(1.,.55,.24),smoothstep(.60,.80,x));
 c=mix(c,vec3(1.,.88,.52),smoothstep(.78,.95,x));
 return mix(c,vec3(1.),smoothstep(.95,1.2,x));}
float spot(float t,float c,float w){float d=abs(fract(t-c+.5)-.5);return exp(-d*d/w);}
void main(){
 vec2 hs=uRes*.5, px=(v-.5)*uRes, n=px/hs;
 float u=clamp(-sdRB(px,hs,uR)/uFw,0.,1.);
 float t=atan(n.y,n.x)/6.2831853+.5;
 float h=.30+.78*spot(t,fract(uT*.045),.006)+.58*spot(t,fract(.37-uT*.031),.011)+.46*spot(t,fract(.71+uT*.023),.004);
 float an=t*6.2831853; vec2 cs=vec2(cos(an),sin(an));
 h+=.5*(fbm(cs*1.5+vec2(uT*.12,3.1))+.6*fbm(cs*.7+vec2(u*2.,uT*.05))-.75);
 float L=length(uTilt);
 if(L>.001) h*=.9+.55*L*max(0.,dot(normalize(n+1e-4),uTilt/L));
 float tube=pow(sin(u*3.14159),.7), k=h*(.55+.6*tube);
 vec3 c=vec3(pal(k+.045).r,pal(k).g,pal(k-.045).b);
 c+=vec3(.15,.95,.8)*.35*smoothstep(.5,.56,k)*(1.-smoothstep(.56,.66,k))*tube;
 gl_FragColor=vec4(c*(.72+.38*tube),1.);
}`;
let HU = null;
if (hg) try {
  const sh = (t, src) => { const o = hg.createShader(t); hg.shaderSource(o, src); hg.compileShader(o); if (!hg.getShaderParameter(o, hg.COMPILE_STATUS)) throw hg.getShaderInfoLog(o); return o; };
  const hp = hg.createProgram(); hg.attachShader(hp, sh(hg.VERTEX_SHADER, 'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}')); hg.attachShader(hp, sh(hg.FRAGMENT_SHADER, HFS)); hg.linkProgram(hp); hg.useProgram(hp);
  hg.bindBuffer(hg.ARRAY_BUFFER, hg.createBuffer()); hg.bufferData(hg.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), hg.STATIC_DRAW);
  const a = hg.getAttribLocation(hp, 'p'); hg.enableVertexAttribArray(a); hg.vertexAttribPointer(a, 2, hg.FLOAT, false, 0, 0);
  HU = {}; for (const n of ['uRes', 'uTilt', 'uT', 'uFw', 'uR']) HU[n] = hg.getUniformLocation(hp, n);
} catch (e) { console.warn(e); HU = null; }
function heatSize() { const r = Math.min(devicePixelRatio || 1, 1.5); hc.width = Math.round(card.clientWidth * r); hc.height = Math.round(card.clientHeight * r); }
const heatRO = new ResizeObserver(heatSize); heatRO.observe(card);
function drawHeat(now, t) {
  if (!HU || !hc.width) return;
  hg.viewport(0, 0, hc.width, hc.height);
  hg.uniform2f(HU.uRes, hc.width, hc.height); hg.uniform2f(HU.uTilt, t.x, t.y);
  hg.uniform1f(HU.uT, now / 1000 * (reduce ? .15 : 1)); hg.uniform1f(HU.uFw, hc.width * .04); hg.uniform1f(HU.uR, hc.width * .044);
  hg.drawArrays(hg.TRIANGLE_STRIP, 0, 4);
}

/* ---------- Scena dimostrativa (colore + profondità disegnati insieme) ---------- */
function demoScene() {
  const W = 900, H = 900, c = mk(W, H), d = mk(W, H), g = c.getContext('2d'), h = d.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, H);
  [[0, '#0f1130'], [.45, '#2c1f62'], [.75, '#8b3d9e'], [1, '#e48ad0']].forEach(s => gr.addColorStop(...s));
  g.fillStyle = gr; g.fillRect(0, 0, W, H); h.fillStyle = '#000'; h.fillRect(0, 0, W, H);
  for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .8 + .1})`; const s = Math.random() * 2.2 + .4; g.fillRect(Math.random() * W, Math.random() * H * .55, s, s); }
  let rg = g.createRadialGradient(650, 210, 50, 650, 210, 240); rg.addColorStop(0, 'rgba(255,220,250,.5)'); rg.addColorStop(1, 'rgba(255,220,250,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fde9ff'; g.beginPath(); g.arc(650, 210, 82, 0, 7); g.fill();
  h.fillStyle = '#141414'; h.beginPath(); h.arc(650, 210, 82, 0, 7); h.fill();
  const L = [['#3a2a78', '#7b63c9', 60, .48, 110, 2.2, 1], ['#2a1d5e', '#5c44a6', 105, .58, 110, 3.1, 2], ['#1b1342', '#45307e', 155, .70, 90, 1.7, 3], ['#0d0a22', '#2c1f55', 200, .83, 70, 2.6, 4]];
  for (const [col, rim, dv, base, amp, f, s] of L) {
    const ridge = x => H * base - amp * (.55 * Math.sin(x / W * f * 6.28 + s) + .3 * Math.sin(x / W * f * 13.1 + s * 2) + .15 * Math.sin(x / W * 31 + s));
    for (const [ctx, fill] of [[g, null], [h, `rgb(${dv},${dv},${dv})`]]) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, ridge(x));
      ctx.lineTo(W, H); ctx.closePath();
      if (fill) ctx.fillStyle = fill; else { const lg = g.createLinearGradient(0, H * base - amp, 0, H); lg.addColorStop(0, rim); lg.addColorStop(.25, col); ctx.fillStyle = lg; }
      ctx.fill();
    }
  }
  const ox = 320, oy = 560, or = 120;
  rg = g.createRadialGradient(ox, oy, 0, ox, oy, or * 2.4); rg.addColorStop(0, 'rgba(200,140,255,.45)'); rg.addColorStop(1, 'rgba(200,140,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  rg = g.createRadialGradient(ox - 40, oy - 45, 8, ox, oy, or); [[0, '#ffffff'], [.25, '#f3d6ff'], [.7, '#a66bff'], [1, '#43218f']].forEach(s => rg.addColorStop(...s));
  g.fillStyle = rg; g.beginPath(); g.arc(ox, oy, or, 0, 7); g.fill();
  rg = h.createRadialGradient(ox, oy, 0, ox, oy, or); rg.addColorStop(0, '#fff'); rg.addColorStop(1, '#d2d2d2');
  h.fillStyle = rg; h.beginPath(); h.arc(ox, oy, or, 0, 7); h.fill();
  return {img: c, depth: d, focus: .62, pos: .5};
}

/* ---------- Profondità di ripiego per una foto (ritratto) ---------- */
function guessDepth(w, h) {
  const c = mk(w, h), x = c.getContext('2d');
  x.fillStyle = '#262626'; x.fillRect(0, 0, w, h);
  x.filter = `blur(${Math.round(w * .07)}px)`;
  x.fillStyle = '#bdbdbd'; x.beginPath(); x.ellipse(w * .5, h * 1.02, w * .46, h * .42, 0, 0, 7); x.fill();
  x.fillStyle = '#fff'; x.beginPath(); x.ellipse(w * .5, h * .4, w * .21, h * .2, 0, 0, 7); x.fill();
  return c;
}

/* ---------- WebGL: parallasse dalla mappa di profondità ---------- */
const gl = cv.getContext('webgl', {antialias: false, premultipliedAlpha: false});
let prog, U = {}, ready = false, view = {focus: .5, pos: .5, ia: 1}, dirty = true;
const VS = 'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
const FS = `precision highp float;varying vec2 v;uniform sampler2D uImg,uDep;uniform vec2 uTilt,uScale,uOff;uniform float uFocus,uStr,uZoom;
vec2 M(vec2 u){return u*uScale+uOff;}
float D(vec2 u){return texture2D(uDep,M(u)).r;}
void main(){
 vec2 b=(v-.5)/uZoom+.5, s=b;
 for(int i=0;i<10;i++){ s=mix(s, b-uTilt*uStr*(D(s)-uFocus), .65); }
 float d=D(s);
 vec3 c=texture2D(uImg,M(s)).rgb;
 c*=1.+.10*(d-uFocus)*(-uTilt.x*.5-uTilt.y*.8);
 gl_FragColor=vec4(c,1.);
}`;
function initGL() {
  if (!gl) return false;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uImg', 'uDep', 'uTilt', 'uScale', 'uOff', 'uFocus', 'uStr', 'uZoom']) U[n] = gl.getUniformLocation(prog, n);
  gl.uniform1i(U.uImg, 0); gl.uniform1i(U.uDep, 1);
  return true;
}
const hasGL = (() => { try { return initGL(); } catch (e) { console.warn(e); return false; } })();
function tex(unit, src) {
  gl.activeTexture(gl.TEXTURE0 + unit); const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
}
function fit(src, max) {
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = Math.min(1, max / Math.max(w, h));
  const c = mk(Math.round(w * k), Math.round(h * k)); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
}
function prepDepth(src, focus) {
  const s = fit(src, 512), c = mk(s.width, s.height), x = c.getContext('2d', {willReadFrequently: true});
  x.filter = `blur(${Math.max(1, s.width * .012).toFixed(1)}px)`; x.drawImage(s, 0, 0); x.filter = 'none';
  if (focus === undefined || focus === '') {
    const px = x.getImageData(c.width * .35 | 0, c.height * .2 | 0, c.width * .3 | 0, c.height * .35 | 0).data;
    let sum = 0; for (let i = 0; i < px.length; i += 4) sum += px[i]; focus = sum / (px.length / 4) / 255;
  }
  view.focus = +focus; return c;
}
let imgCanvas = null;
function setScene(img, depth, opts = {}) {
  const max = hasGL ? Math.min(2048, gl.getParameter(gl.MAX_TEXTURE_SIZE)) : 1600;
  imgCanvas = fit(img, max); view.ia = imgCanvas.width / imgCanvas.height;
  view.pos = +(opts.pos ?? CARD.pos);
  const dc = prepDepth(depth || guessDepth(imgCanvas.width >> 2, imgCanvas.height >> 2), opts.focus ?? CARD.focus);
  if (hasGL) { tex(0, imgCanvas); tex(1, dc); }
  ready = true; dirty = true; art.classList.remove('loading'); resize();
}
function resize() {
  const r = Math.min(devicePixelRatio || 1, 2), w = Math.round(art.clientWidth * r), h = Math.round(art.clientHeight * r);
  if (w && h && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; dirty = true; }
}
new ResizeObserver(resize).observe(art);
const ctx2d = hasGL ? null : cv.getContext('2d');
function draw(t) {
  if (!ready) return;
  const ca = cv.width / cv.height, ia = view.ia;
  const sc = ia > ca ? [ca / ia, 1] : [1, ia / ca];
  const off = [(1 - sc[0]) * .5, (1 - sc[1]) * view.pos];
  if (hasGL) {
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(U.uTilt, t.x, t.y); gl.uniform2f(U.uScale, sc[0], sc[1]); gl.uniform2f(U.uOff, off[0], off[1]);
    gl.uniform1f(U.uFocus, view.focus); gl.uniform1f(U.uStr, +CARD.strength); gl.uniform1f(U.uZoom, 1.07);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    const W = cv.width, H = cv.height, iw = imgCanvas.width * sc[0], ih = imgCanvas.height * sc[1];
    ctx2d.drawImage(imgCanvas, imgCanvas.width * off[0], imgCanvas.height * off[1], iw, ih, -W * .04 - t.x * W * .02, -H * .04 - t.y * H * .02, W * 1.08, H * 1.08);
  }
}

/* ---------- Movimento: giroscopio, mouse, trascinamento, oscillazione a riposo (con molla) ---------- */
const tgt = {x: 0, y: 0}, cur = {x: 0, y: 0}, vel = {x: 0, y: 0};
let gyro = false, drag = false, last = -1e9, base = null;
function fromPointer(e) {
  const r = card.getBoundingClientRect();
  tgt.x = clamp((e.clientX - r.left - r.width / 2) / (r.width / 2) * 1.1);
  tgt.y = clamp((e.clientY - r.top - r.height / 2) / (r.height / 2) * 1.1);
  last = performance.now();
}
const stage = $('stage');
addEventListener('pointermove', e => { if (gyro) return; if (e.pointerType === 'mouse' || drag) fromPointer(e); });
stage.addEventListener('pointerdown', e => { askMotion(); if (gyro || e.target.closest('a')) return; drag = true; stage.setPointerCapture(e.pointerId); fromPointer(e); });
const release = () => { if (!drag) return; drag = false; tgt.x = tgt.y = 0; last = performance.now() - 2500; };
stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);
document.addEventListener('mouseleave', () => { if (!gyro) { tgt.x = tgt.y = 0; last = performance.now() - 2500; } });
function onOri(e) {
  if (e.beta == null || e.gamma == null) return;
  const a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let x = e.gamma, y = e.beta;
  if (a === 90) { x = e.beta; y = -e.gamma; } else if (a === -90 || a === 270) { x = -e.beta; y = e.gamma; }
  if (!base) base = {x, y};
  base.x += (x - base.x) * .006; base.y += (y - base.y) * .006;
  tgt.x = clamp((x - base.x) / 16); tgt.y = clamp((y - base.y) / 16);
  gyro = true; last = performance.now(); $('motion').hidden = true;
}
const needsPerm = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
let asked = false;
function askMotion() {
  if (!needsPerm || asked) return; asked = true;
  DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') addEventListener('deviceorientation', onOri); }).catch(() => {}).finally(() => { $('motion').hidden = true; });
}
addEventListener('deviceorientation', onOri);
if (needsPerm && matchMedia('(pointer: coarse)').matches) { $('motion').hidden = false; $('motion').addEventListener('click', askMotion); }

const cs = card.style, ss = stage.style;
let prev = {x: 9, y: 9};
function frame(now) {
  if (!gyro && !drag && now - last > 3500 && !reduce) { tgt.x = Math.sin(now / 2300) * .55; tgt.y = Math.sin(now / 1700 + 1) * .38; }
  for (const k of ['x', 'y']) { vel[k] = (vel[k] + (tgt[k] - cur[k]) * .055) * .8; cur[k] += vel[k]; }
  if (Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y) > .0008 || dirty) {
    const m = Math.min(1, Math.hypot(cur.x, cur.y));
    for (const st of [cs, ss]) { st.setProperty('--tx', cur.x.toFixed(4)); st.setProperty('--ty', cur.y.toFixed(4)); st.setProperty('--hyp', m.toFixed(3)); }
    cs.setProperty('--mx', (50 + cur.x * 50).toFixed(2) + '%'); cs.setProperty('--my', (50 + cur.y * 50).toFixed(2) + '%');
    cs.setProperty('--bx', (50 + cur.x * 30).toFixed(2) + '%'); cs.setProperty('--by', (50 + cur.y * 30).toFixed(2) + '%');
    draw(cur); prev = {...cur}; dirty = false;
  }
  drawHeat(now, cur);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Caricamento della carta ---------- */
const loadImg = src => new Promise((ok, ko) => { const i = new Image(); i.decoding = 'async'; i.onload = () => ok(i); i.onerror = ko; i.src = src; });
(async () => {
  if (CARD.img) {
    try {
      const [im, dp] = await Promise.all([loadImg(CARD.img), CARD.depth ? loadImg(CARD.depth).catch(() => null) : null]);
      renderText(); setScene(im, dp); return;
    } catch (e) { console.warn('Immagine non trovata', e); }
  }
  demo = true; renderText();
  const d = demoScene(); setScene(d.img, d.depth, {focus: d.focus, pos: d.pos});
  $('tool').hidden = false;
})();
if (location.hash === '#studio') $('tool').hidden = false;

/* ---------- Studio: crea una carta dalla tua foto ---------- */
const sheet = $('sheet'), status = $('status');
const say = t => { status.textContent = t; };
const fields = {name: 'f-name', text: 'f-text', cta: 'f-cta', link: 'f-link'};
for (const [k, id] of Object.entries(fields)) { $(id).value = CARD[k]; $(id).addEventListener('input', () => { CARD[k] = $(id).value; renderText(); }); }
$('tool').addEventListener('click', () => { sheet.hidden = false; });
$('close').addEventListener('click', () => { sheet.hidden = true; });
sheet.addEventListener('submit', e => e.preventDefault());
let fileBase = 'foto', fileName = 'foto.jpg';
const enable = (id, on = true) => $(id).setAttribute('aria-disabled', String(!on));

async function aiDepth(src) {
  const T = await import(TJS);
  const opts = {progress_callback: p => { if (p.status === 'progress' && p.progress) say(`Scarico il modello di profondità… ${Math.round(p.progress)}%`); }};
  let est;
  try { est = await T.pipeline('depth-estimation', MODEL, {...opts, device: navigator.gpu ? 'webgpu' : 'wasm'}); }
  catch (e) { est = await T.pipeline('depth-estimation', MODEL, {...opts, device: 'wasm'}); }
  say('Calcolo la profondità…');
  const out = await est(T.RawImage.fromCanvas(fit(src, 640)));
  return out.depth.toCanvas();
}
$('f-photo').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  fileName = f.name.replace(/\s+/g, '-'); fileBase = fileName.replace(/\.[^.]+$/, '');
  art.classList.add('loading'); say('Carico la foto…');
  const im = await loadImg(URL.createObjectURL(f));
  setScene(im, null, {focus: '', pos: CARD.pos});
  enable('copy'); enable('qrb');
  try {
    const dc = await aiDepth(im);
    setScene(im, dc, {focus: '', pos: CARD.pos});
    const dl = $('dl'); dl.href = dc.toDataURL('image/png'); dl.download = fileBase + '-depth.png'; enable('dl');
    say('Profondità pronta. Inclina la carta per vedere l’effetto.');
  } catch (err) {
    console.warn(err);
    say('Qui il modello AI non è raggiungibile: uso una profondità approssimata. Sulla tua pagina pubblicata la stima AI funziona.');
  }
});
function cardLink() {
  const p = new URLSearchParams({img: fileName, depth: fileBase + '-depth.png', name: CARD.name, text: CARD.text, cta: CARD.cta});
  if (CARD.link) p.set('link', CARD.link);
  return location.origin + location.pathname + '?' + p.toString();
}
$('copy').addEventListener('click', async () => {
  const l = $('link'); l.value = cardLink(); l.hidden = false; l.select();
  try { await navigator.clipboard.writeText(l.value); say('Link copiato.'); } catch { say('Copia il link qui sotto.'); }
});
$('qrb').addEventListener('click', async () => {
  try {
    if (!window.qrcode) await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = QRJS; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
    const qr = window.qrcode(0, 'M'); qr.addData(cardLink()); qr.make();
    const im = new Image(); im.src = qr.createDataURL(6, 2); im.alt = 'QR della carta';
    $('qr').replaceChildren(im); say('QR pronto: salvalo con uno screenshot o tenendo premuto.');
  } catch { say('Non riesco a generare il QR qui.'); }
});
}
</script>
